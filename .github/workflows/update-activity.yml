name: Refresh profile activity artwork

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-activity-artwork
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render visible contributions
        run: python3 scripts/update_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: Tanish18906
      - name: Commit changed artwork
        run: |
          if git diff --quiet -- assets/activity.svg; then
            echo "Contribution artwork is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "chore: refresh profile contribution artwork"
          git push

<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-label="PRATYAKSH: Evidence-driven data leak forensics">
  <defs>
    <linearGradient id="cardBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08152B"/>
      <stop offset="100%" stop-color="#142540"/>
    </linearGradient>
    <pattern id="micro2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#4DBDB8" stroke-opacity="0.04" fill="none"/>
    </pattern>
  </defs>

  <!-- Background card -->
  <rect x="1" y="1" width="618" height="298" rx="16" fill="url(#cardBg2)" stroke="#4DBDB8" stroke-opacity="0.32" stroke-width="1.5"/>
  <rect x="2" y="2" width="616" height="296" rx="15" fill="url(#micro2)"/>

  <!-- Badge / Index -->
  <rect x="30" y="32" width="10" height="10" rx="2" fill="#F2B84B"/>
  <text x="50" y="42" fill="#F2B84B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">FEATURED // 02</text>

  <!-- Title & Subtitle -->
  <text x="30" y="108" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">PRATYAKSH</text>
  <text x="31" y="140" fill="#A8B8C8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Evidence-Driven Data Leak Forensics</text>

  <!-- Pipeline tag pill -->
  <rect x="30" y="172" rx="14" width="280" height="28" fill="#4DBDB8" fill-opacity="0.1" stroke="#4DBDB8" stroke-opacity="0.45" stroke-width="1"/>
  <text x="44" y="191" fill="#4DBDB8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1">SOURCE &gt; CUSTODY &gt; FINDINGS</text>

  <!-- Bottom divider & metadata -->
  <line x1="30" y1="238" x2="590" y2="238" stroke="#4DBDB8" stroke-opacity="0.18"/>
  <text x="30" y="266" fill="#A8B8C8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">FASTAPI · REACT · CYTOSCAPE · 262 TESTS</text>
  <text x="590" y="266" fill="#4DBDB8" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">EXPLORE REPO ↗</text>

  <!-- Vector Custody & Provenance Graph -->
  <g transform="translate(370, 56)">
    <!-- Horizontal Grid Tracks -->
    <line x1="10" y1="45" x2="215" y2="45" stroke="#4DBDB8" stroke-opacity="0.15" stroke-dasharray="3 6"/>
    <line x1="10" y1="105" x2="215" y2="105" stroke="#4DBDB8" stroke-opacity="0.15" stroke-dasharray="3 6"/>
    <line x1="10" y1="165" x2="215" y2="165" stroke="#4DBDB8" stroke-opacity="0.15" stroke-dasharray="3 6"/>

    <!-- Investigation Path: Primary Traced Flow -->
    <path d="M25 145 L85 55 L145 105 L200 35" fill="none" stroke="#4DBDB8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inferred Alternative Branch (Dashed) -->
    <path d="M25 145 L95 165 L145 105 L200 170" fill="none" stroke="#F2B84B" stroke-width="1.8" stroke-dasharray="5 7" stroke-opacity="0.75"/>

    <!-- Nodes / Entities -->
    <!-- Source Node -->
    <rect x="8" y="128" width="34" height="34" rx="8" fill="#142540" stroke="#4DBDB8" stroke-width="1.8"/>
    <circle cx="25" cy="145" r="4" fill="#4DBDB8"/>

    <!-- Midpoint Server 1 -->
    <rect x="68" y="38" width="34" height="34" rx="8" fill="#142540" stroke="#4DBDB8" stroke-width="1.8"/>
    <circle cx="85" cy="55" r="4" fill="#4DBDB8"/>

    <!-- Focal Chokepoint (Investigation target) -->
    <circle cx="145" cy="105" r="18" fill="#08152B" stroke="#4DBDB8" stroke-width="2.5"/>
    <circle cx="145" cy="105" r="10" fill="#4DBDB8" fill-opacity="0.25"/>
    <circle cx="145" cy="105" r="5" fill="#4DBDB8"/>

    <!-- Destination Exfiltration -->
    <rect x="183" y="18" width="34" height="34" rx="8" fill="#142540" stroke="#4DBDB8" stroke-width="1.8"/>
    <circle cx="200" cy="35" r="4" fill="#4DBDB8"/>

    <!-- Unverified Node -->
    <circle cx="200" cy="170" r="11" fill="#142540" stroke="#F2B84B" stroke-width="1.5"/>
    <circle cx="200" cy="170" r="3.5" fill="#F2B84B"/>
  </g>
</svg>
